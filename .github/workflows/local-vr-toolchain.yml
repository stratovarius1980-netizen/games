name: Export local Godot Android toolchain
on:
  push:
    branches: [varwin-vr-rebuild-toolchain]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  toolchain:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Download Godot and Android export templates
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p dist /tmp/godot
          curl -fL --retry 3 'https://downloads.godotengine.org/?version=4.6.3&flavor=stable&platform=linux.64&slug=linux.x86_64.zip' -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          cp /tmp/godot/Godot_v4.6.3-stable_linux.x86_64 dist/godot
          chmod +x dist/godot
          curl -fL --retry 3 'https://downloads.godotengine.org/?version=4.6.3&flavor=stable&platform=templates&slug=export_templates.tpz' -o /tmp/templates.tpz
          unzip -Z1 /tmp/templates.tpz | grep -E 'android_(debug|release).apk' | head -n 20
          unzip -q -j /tmp/templates.tpz 'templates/android_debug.apk' 'templates/android_release.apk' -d dist/
          ls -lh dist/*
      - name: Export Android sign tools
        shell: bash
        run: |
          set -euxo pipefail
          APT="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort | tail -1)"
          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort | tail -1)"
          test -x "$APT"; test -x "$ZIPALIGN"
          cp "$APT" dist/apksigner
          cp "$ZIPALIGN" dist/zipalign
          cp "$(dirname "$APT")/lib/apksigner.jar" dist/apksigner.jar
          sha256sum dist/* > dist/SHA256SUMS
          cat dist/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: godot-4-6-3-local-vr-toolchain
          path: dist/
          retention-days: 3
          if-no-files-found: error
