name: Embodiment Lab Quest2 Godot 4.6.3
on:
  push:
    branches: [quest2-embodiment-lab-godot463]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Locate Android SDK
        shell: bash
        run: |
          set -euxo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -x "$SDKMANAGER"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Install Godot 4.6.3 and Android templates
        shell: bash
        run: |
          set -euxo pipefail
          curl -fL --retry 3 'https://downloads.godotengine.org/?version=4.6.3&flavor=stable&platform=linux.64&slug=linux.x86_64.zip' -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo install -m755 /tmp/godot/Godot_v4.6.3-stable_linux.x86_64 /usr/local/bin/godot
          curl -fL --retry 3 'https://downloads.godotengine.org/?version=4.6.3&flavor=stable&platform=templates&slug=export_templates.tpz' -o /tmp/templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/4.6.3.stable"
          unzip -q -j /tmp/templates.tpz -d "$HOME/.local/share/godot/export_templates/4.6.3.stable"
      - name: Install Meta Quest OpenXR loader add-on
        shell: bash
        run: |
          set -euxo pipefail
          curl -fL --retry 3 'https://github.com/GodotVR/godot_openxr_vendors/releases/download/5.1.0-stable/godotopenxrvendorsaddon.zip' -o /tmp/vendors.zip
          mkdir -p /tmp/vendors vr/addons
          unzip -q /tmp/vendors.zip -d /tmp/vendors
          ADDON="$(find /tmp/vendors -type d -name godotopenxrvendors | head -n 1)"
          test -n "$ADDON"
          cp -a "$ADDON" vr/addons/
          test -f vr/addons/godotopenxrvendors/plugin.gdextension
      - name: Setup editor and debug signing
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$HOME/.android"
          keytool -genkeypair -noprompt -keystore "$HOME/.android/debug.keystore" -alias androiddebugkey -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=QuestProbe,O=EmbodimentLab,C=US"
          godot --headless --xr-mode off --editor --path vr --import --quit || echo 'Headless GDExtension shutdown exit ignored; export validated separately'
          python3 - <<'PY'
          import os, pathlib
          path=max((pathlib.Path.home()/'.config/godot').glob('editor_settings-4.*.tres'),key=lambda p:p.stat().st_mtime)
          content=path.read_text()
          content+='\nexport/android/android_sdk_path = "%s"\n' % os.environ['ANDROID_HOME']
          content+='export/android/java_sdk_path = "%s"\n' % os.environ['JAVA_HOME']
          path.write_text(content)
          PY
      - name: Smoke test complete lab startup without headset
        shell: bash
        run: |
          godot --headless --xr-mode off --path vr --quit-after 15 >/tmp/probe-smoke.log 2>&1 || true
          cat /tmp/probe-smoke.log
          grep -q 'EMBODIMENT_XR_CHECK: MAIN_SCENE_STARTED' /tmp/probe-smoke.log
          grep -q 'EMBODIMENT_XR_CHECK: LAB_SCENE_BUILT' /tmp/probe-smoke.log
          ! grep -E 'SCRIPT ERROR|Parse Error|Failed to load script|Invalid call|Invalid get index|Invalid assignment|Attempt to call function' /tmp/probe-smoke.log
      - name: Build complete Embodiment Lab Quest2 APK
        shell: bash
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          set -euxo pipefail
          export GODOT_ANDROID_KEYSTORE_DEBUG_PATH="$HOME/.android/debug.keystore"
          mkdir -p vr/build
          godot --headless --xr-mode off --path vr --install-android-build-template --export-debug "Meta Quest Immersive" build/EmbodimentLab-Quest2-Godot463.apk || echo "CLI finished nonzero; checking APK"
          test -s vr/build/EmbodimentLab-Quest2-Godot463.apk
      - name: Verify finished Quest2 APK immersive manifest
        shell: bash
        run: |
          python3 - <<'PY'
          import zipfile
          for name in ['EmbodimentLab-Quest2-Godot463.apk']:
              path='vr/build/'+name
              with zipfile.ZipFile(path) as z:
                  assert z.testzip() is None
                  manifest=z.read('AndroidManifest.xml')
                  categories=['org.khronos.openxr.intent.category.IMMERSIVE_HMD','com.oculus.intent.category.VR']
                  matches=[s for s in categories if s.encode('utf-16le') in manifest or s.encode() in manifest]
                  print(name, matches)
                  assert matches, f'{name}: no immersive headset intent'
          PY
          cd vr/build && sha256sum *.apk > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: EmbodimentLab-Quest2-Godot463-APK
          retention-days: 45
          path: |
            vr/build/EmbodimentLab-Quest2-Godot463.apk
            vr/build/SHA256SUMS
          if-no-files-found: error
