name: Build Embodiment Lab VR APK

on:
  push:
    branches: [embodiment-lab-openxr-apk]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME}"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -x "$SDKMANAGER"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
      - name: Android SDK components
        shell: bash
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Godot and export templates
        shell: bash
        run: |
          set -euxo pipefail
          curl -fL --retry 3 'https://downloads.godotengine.org/?version=4.7.2&flavor=stable&platform=linux.64&slug=linux.x86_64.zip' -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo install -m755 /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 /usr/local/bin/godot
          curl -fL --retry 3 'https://downloads.godotengine.org/?version=4.7.2&flavor=stable&platform=templates&slug=export_templates.tpz' -o /tmp/templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          unzip -q -j /tmp/templates.tpz -d "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          godot --version
      - name: Install Quest vendor support and Gradle template
        shell: bash
        run: |
          set -euxo pipefail
          curl -fL --retry 3 'https://github.com/GodotVR/godot_openxr_vendors/releases/download/5.1.0-stable/godotopenxrvendorsaddon.zip' -o /tmp/vendors.zip
          mkdir -p /tmp/vendors vr/addons
          unzip -q /tmp/vendors.zip -d /tmp/vendors
          ADDON_DIR="$(find /tmp/vendors -type d -name godotopenxrvendors | head -n 1)"
          test -n "$ADDON_DIR"
          cp -a "$ADDON_DIR" vr/addons/
          test -f vr/addons/godotopenxrvendors/plugin.gdextension
          find vr/addons/godotopenxrvendors -maxdepth 2 -type f | head -n 30
      - name: Android editor settings and debug keystore
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$HOME/.android"
          keytool -genkeypair -noprompt -keystore "$HOME/.android/debug.keystore" -alias androiddebugkey -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=EmbodimentLab,O=Prototype,C=US"
          godot --headless --editor --path vr --import --quit
          python3 - <<'PY'
          import pathlib, os, re
          conf=max((pathlib.Path.home()/'.config/godot').glob('editor_settings-4.*.tres'), key=lambda p:p.stat().st_mtime)
          s=conf.read_text()
          for key,val in [('export/android/android_sdk_path',os.environ['ANDROID_HOME']),('export/android/java_sdk_path',os.environ['JAVA_HOME'])]:
              val=val.replace('\\','/')
              line=f'{key} = "{val}"'
              s=re.sub(rf'(?m)^{re.escape(key)}\\s*=.*$',line,s)
              if line not in s:s+='\n'+line+'\n'
          conf.write_text(s)
          print('SDK config:', conf)
          PY
      - name: Export debug-signed OpenXR APK
        shell: bash
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          set -euxo pipefail
          export GODOT_ANDROID_KEYSTORE_DEBUG_PATH="$HOME/.android/debug.keystore"
          mkdir -p vr/build
          godot --headless --path vr --install-android-build-template --export-debug "Meta Quest Immersive" build/EmbodimentLab-Quest-Immersive.apk
          test -s vr/build/EmbodimentLab-Quest-Immersive.apk
          sha256sum vr/build/EmbodimentLab-Quest-Immersive.apk > vr/build/SHA256SUMS
      - name: Verify immersive VR Android manifest
        shell: bash
        run: |
          python3 - <<'PY'
          import zipfile
          apk = "vr/build/EmbodimentLab-Quest-Immersive.apk"
          with zipfile.ZipFile(apk) as z:
              data = z.read("AndroidManifest.xml")
              labels = ("org.khronos.openxr.intent.category.IMMERSIVE_HMD", "com.oculus.intent.category.VR")
              found = [x for x in labels if x.encode("utf-16le") in data or x.encode() in data]
              print("Immersive VR intent categories:", found)
              if not found:
                  raise SystemExit("ERROR: APK lacks immersive VR intent; refusing to publish as Quest VR.")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: EmbodimentLab-Quest-Immersive-APK
          path: |
            vr/build/EmbodimentLab-Quest-Immersive.apk
            vr/build/SHA256SUMS
          retention-days: 30
          if-no-files-found: error
